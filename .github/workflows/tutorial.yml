name: BNN tutorial checks
on: [push, pull_request]
jobs:
  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-tutorial.txt
      - run: python -m pytest -q
      - name: Execute introductory notebook
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          path = 'notebooks/bnn_from_scratch_tutorial.ipynb'
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=180, kernel_name='python3').execute(cwd='notebooks')
          PY
